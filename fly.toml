# fly.toml app configuration file generated for homo-lumo-gat on 2026-07-12T18:20:32+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'homo-lumo-gat'
primary_region = 'fra'

[build]
  dockerfile = "Dockerfile.flyio"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
